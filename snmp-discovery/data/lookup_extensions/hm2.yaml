# Hirschmann — sysObjectID -> device model lookups for SNMP discovery.
# Manufacturer (IANA PEN 248) is canonicalized in _manufacturers_ndx.yaml. Entries are
# the OWL industrial cellular routers under .1.3.6.1.4.1.248.40 from
# HIRSCHMANN-WAN-PRODUCTS-MIB. (HM2-PRODUCTS-MIB registered only a MIB-module anchor,
# not device sysObjectIDs, so it is not included.)
devices:
  .1.3.6.1.4.1.248.40.1.1.1: owl-3g
  .1.3.6.1.4.1.248.40.1.1.2: owl-LTE
  .1.3.6.1.4.1.248.40.1.1.3: owl-LTE-M12
