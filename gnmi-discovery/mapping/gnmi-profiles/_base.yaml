match: {}
device:
  hostname: /system/state/hostname
  os_version: /system/state/software-version
interfaces:
  list_path: /interfaces/interface
  keys:
    name: name
    description: config/description
    admin_status: state/admin-status
    mtu: state/mtu
    # OpenConfig iana-if-type identityref (e.g. "iana-if-type:ieee8023adLag").
    # Mapped to a NetBox interface type for lag/virtual/etc. in translate.go;
    # ethernet media is not derivable from the type alone, so it falls through to
    # a user interface_patterns rule or the interface.if_type default.
    type: state/type
    # H-2: speed (ethernet/state/port-speed) and lag_member
    # (ethernet/state/aggregate-id) are intentionally NOT curated yet — the
    # translator does not map them, so subscribing would only churn the model
    # without changing the Diode payload. Add them back here together with their
    # Interface.Speed / Interface.Lag mapping in translate.go (deferred
    # enrichment; see spec §6 interfaces).
components:
  list_path: /components/component
  keys:
    name: name
    type: state/type
    serial: state/serial-no
    part: state/part-no
    mfg_name: state/mfg-name
    parent: state/parent
