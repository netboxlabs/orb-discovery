[project]
name = "orb-mcp-server"
version = "0.1.0"
description = "MCP server for orb-discovery — manage snmp-discovery, snmp-telemetry and probe-telemetry agents"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "mcp[cli]>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "croniter>=5.0",
]

[project.scripts]
orb-mcp-server = "orb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C", "E", "F", "I", "UP", "W"]
ignore = ["D"]
