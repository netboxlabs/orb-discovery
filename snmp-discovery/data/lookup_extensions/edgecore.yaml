# Edgecore — sysObjectID -> device model lookups for SNMP discovery.
# The manufacturer (IANA PEN 52587) is canonicalized in _manufacturers_ndx.yaml;
# this file only maps each model's full sysObjectID to its model name. Root every
# entry at .1.3.6.1.4.1.52587 and match the model string to the NDX device-type
# `model:` so discovered devices line up with the DTL entry.
devices:
  # .1.3.6.1.4.1.52587.<...>: <Model name>
